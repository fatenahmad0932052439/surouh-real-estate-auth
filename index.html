<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surouh Real Estate | Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-navy: #0F172A;       
            --navy-surface: #1E293B;       
            --accent-blue: #38BDF8;        
            --accent-gold: #C5A880;        
            --bg-gray: #0B0F19;            
            --card-gray: #151E2E;          
            --border-gray: #334155;        
            --text-light: #F8FAFC;         
            --text-muted: #94A3B8;         
            --error-red: #EF4444;
            --success-green: #10B981;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-gray);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.25;
            pointer-events: none;
        }
        .bg-glow-1 {
            width: 320px;
            height: 320px;
            background: #1E3A8A; 
            top: 0;
            right: 0;
        }
        .bg-glow-2 {
            width: 300px;
            height: 300px;
            background: #475569; 
            bottom: 0;
            left: 0;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 410px;
            background: rgba(21, 30, 46, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, #1E293B, #0F172A);
            border: 2px solid rgba(197, 168, 128, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(197, 168, 128, 0.15);
            margin-bottom: 10px;
            position: relative;
            animation: continuousSpin 8s infinite linear;
        }

        @keyframes continuousSpin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
            100% { transform: rotateY(360deg); }
        }

        .logo-wrap::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 1px solid var(--accent-gold);
            opacity: 0;
            animation: pulseRing 2s infinite ease-out;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.85); opacity: 0.8; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .logo-svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: var(--accent-gold);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            color: var(--text-light);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .brand-title span {
            color: var(--accent-gold);
        }
        .brand-tagline {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 3px;
        }

        /* رسائل النظام التنبيهية */
        .status-msg {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            animation: fadeInOnly 0.3s ease forwards;
        }
        .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            color: #6EE7B7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .forms-slider {
            position: relative;
            width: 100%;
        }

        .auth-form {
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .auth-form.active {
            display: block;
            opacity: 1;
            animation: fadeInOnly 0.25s ease forwards;
        }

        @keyframes fadeInOnly {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-title {
            color: var(--text-light);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-title i {
            color: var(--accent-gold);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 14px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-box i.input-icon {
            position: absolute;
            left: 14px;
            color: #64748B;
            font-size: 14px;
            transition: var(--transition);
        }
        .input-box input {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-gray);
            border-radius: 10px;
            padding: 10px 36px 10px 38px;
            color: var(--text-light);
            font-size: 13.5px;
            outline: none;
            transition: var(--transition);
        }
        .input-box input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(197, 168, 128, 0.15);
            background-color: rgba(15, 23, 42, 0.95);
        }
        .input-box input:focus ~ i.input-icon {
            color: var(--accent-gold);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #64748B;
            font-size: 13px;
            transition: var(--transition);
        }
        .toggle-password:hover {
            color: var(--text-light);
        }

        .form-extras {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 12px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .remember-me input {
            accent-color: var(--accent-gold);
            cursor: pointer;
            width: 14px;
            height: 14px;
        }
        .forgot-link {
            color: var(--accent-gold);
            text-decoration: none;
            transition: var(--transition);
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #C5A880, #A88656);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(197, 168, 128, 0.2);
            transition: var(--transition);
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #d3b993, #b89564);
            transform: translateY(-1px);
        }
        .submit-btn:active {
            transform: translateY(0);
        }

        .toggle-wrapper {
            margin-top: 18px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding-top: 14px;
        }
        .toggle-link {
            color: var(--accent-gold);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-left: 4px;
            transition: var(--transition);
        }
        .toggle-link:hover {
            color: #e4cdae;
            text-decoration: underline;
        }

        /* شاشة الترحيب لفاتن */
        .welcome-view {
            text-align: center;
            padding: 15px 0;
        }
        .welcome-title {
            color: var(--accent-gold);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .welcome-desc {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 24px 18px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="auth-container">
        
        <header class="brand-header">
            <div class="logo-wrap">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12C14.2091 12 16 13.7909 16 16C16 18.2091 14.2091 20 12 20C9.79086 20 8 18.2091 8 16" />
                    <path d="M12 8V16" opacity="0.5" />
                    <circle cx="16" cy="16" r="1.5" fill="#C5A880" stroke="none" />
                </svg>
            </div>
            <h1 class="brand-title">SURouh <span>REAL ESTATE</span></h1>
            <p class="brand-tagline">Your gateway to premium properties</p>
        </header>

        <!-- صندوق التنبيهات والأخطاء بالإنجليزية -->
        <div id="statusAlert" class="status-msg"></div>

        <div class="forms-slider">
            
            <!-- 1. نموذج تسجيل الدخول -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-title">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Login to your account</span>
                </div>

                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-box">
                        <input type="email" id="login-email" placeholder="name@example.com" required>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <div class="input-box">
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
                    </div>
                </div>

                <div class="form-extras">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="javascript:void(0)" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="toggle-wrapper">
                    <span>Don't have an account?</span>
                    <a href="javascript:void(0)" class="toggle-link" onclick="switchForm('register')">Create an account</a>
                </div>
            </form>

            <!-- 2. نموذج إنشاء الحساب -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-title">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Create a new account</span>
                </div>

                <div class="input-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-box">
                        <input type="text" id="reg-name" placeholder="Faten" required>
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-box">
                        <input type="email" id="reg-email" placeholder="faten@example.com" required>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-phone">Phone Number</label>
                    <div class="input-box">
                        <input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required>
                        <i class="fa-solid fa-phone input-icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <div class="input-box">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Confirm & Create</span>
                    <i class="fa-solid fa-check"></i>
                </button>

                <div class="toggle-wrapper">
                    <span>Already have an account?</span>
                    <a href="javascript:void(0)" class="toggle-link" onclick="switchForm('login')">Login here</a>
                </div>
            </form>

            <!-- 3. شاشة الترحيب (Welcome Screen) -->
            <div id="welcomeScreen" class="auth-form">
                <div class="welcome-view">
                    <h2 class="welcome-title">Welcome, I am Faten</h2>
                    <p class="welcome-desc">You have successfully logged in to your exclusive real estate dashboard.</p>
                    <button type="button" class="submit-btn" onclick="logout()">
                        <span>Log Out</span>
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- الباك إند وقاعدة البيانات المحلية -->
    <script>
        // إعداد قاعدة البيانات وحساب فاتن الافتراضي
        function initBackend() {
            if (!localStorage.getItem('usersDatabase')) {
                const initialUsers = [
                    {
                        name: "Faten",
                        email: "faten@example.com",
                        password: "123456",
                        phone: "+1 555 123 4567"
                    }
                ];
                localStorage.setItem('usersDatabase', JSON.stringify(initialUsers));
            }
        }
        initBackend();

        // إظهار الرسائل التنبيهية
        function showMessage(text, type) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.className = `status-msg ${type}`;
            alertBox.innerText = text;
            alertBox.style.display = 'block';
        }

        function hideMessage() {
            const alertBox = document.getElementById('statusAlert');
            alertBox.style.display = 'none';
        }

        // معالجة تسجيل الدخول (Backend Login Logic)
        function handleLogin(event) {
            event.preventDefault();
            hideMessage();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const users = JSON.parse(localStorage.getItem('usersDatabase')) || [];

            // البحث عن المستخدم
            const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());

            if (!user) {
                // إذا لم يكن مسجلاً مسبقاً
                showMessage("Account not found. Please create an account first.", "error");
                return;
            }

            if (user.password !== password) {
                // إذا كانت كلمة السر خاطئة
                showMessage("Invalid credentials. Please check your password.", "error");
                return;
            }

            // في حال نجاح الدخول: تحويل لشاشة الترحيب
            hideMessage();
            showWelcomeScreen();
        }

        // معالجة إنشاء الحساب (Backend Registration Logic)
        function handleRegister(event) {
            event.preventDefault();
            hideMessage();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;

            const users = JSON.parse(localStorage.getItem('usersDatabase')) || [];

            // التحقق مما إذا كان البريد مسجلاً مسبقاً
            if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                showMessage("This email is already registered. Please log in.", "error");
                return;
            }

            // حفظ المستخدم الجديد
            users.push({ name, email, phone, password });
            localStorage.setItem('usersDatabase', JSON.stringify(users));

            // تنبيه بالنجاح وتحويل لصفحة الدخول
            showMessage("Account created successfully! You can now log in.", "success");
            switchForm('login');
            document.getElementById('login-email').value = email;
            document.getElementById('registerForm').reset();
        }

        // التبديل إلى شاشة الترحيب
        function showWelcomeScreen() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            const welcome = document.getElementById('welcomeScreen');
            welcome.style.display = 'block';
            void welcome.offsetWidth;
            welcome.classList.add('active');
        }

        // تسجيل الخروج
        function logout() {
            document.getElementById('loginForm').reset();
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('welcomeScreen').classList.remove('active');
            hideMessage();
            switchForm('login');
        }

        // دوال التبديل وإظهار كلمة السر
        function switchForm(target) {
            hideMessage();
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const welcomeScreen = document.getElementById('welcomeScreen');
            welcomeScreen.style.display = 'none';

            if (target === 'register') {
                loginForm.classList.remove('active');
                setTimeout(() => {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                    void registerForm.offsetWidth;
                    registerForm.classList.add('active');
                }, 150);
            } else {
                registerForm.classList.remove('active');
                setTimeout(() => {
                    registerForm.style.display = 'none';
                    loginForm.style.display = 'block';
                    void loginForm.offsetWidth;
                    loginForm.classList.add('active');
                }, 150);
            }
        }

        function togglePasswordVisibility(inputId, iconElement) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                iconElement.classList.remove('fa-eye');
                iconElement.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                iconElement.classList.remove('fa-eye-slash');
                iconElement.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
